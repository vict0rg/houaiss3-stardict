[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "houaiss3-stardict"
version = "0.4.0.dev0"
description = "Educational legacy dictionary interoperability study and StarDict converter"
requires-python = ">=3.10"
authors = [
    {name = "Victor Gianordoli"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
]

[project.scripts]
houaiss3-stardict = "houaiss3_stardict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
